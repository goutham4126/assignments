<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bank Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100 p-6">

  <h1 class="text-3xl font-bold mb-6">Online Banking Dashboard</h1>

  <div class="flex gap-4 mb-4">
    <input id="searchInput" placeholder="Search by name..." class="border p-2 rounded w-1/2" />
    <select id="cityFilter" class="border p-2 rounded w-1/2">
      <option value="">Filter by city</option>
    </select>
  </div>

  <div class="bg-white p-4 rounded shadow mb-6">
    <h2 class="text-xl font-bold mb-2">Create New Account</h2>
    <form id="accountForm" class="flex gap-4">
      <input required id="username" placeholder="Name" class="border p-2 rounded w-1/3" />
      <input required id="email" placeholder="Email" class="border p-2 rounded w-1/3" />
      <input required id="branch" placeholder="Branch" class="border p-2 rounded w-1/3" />
      <button class="bg-blue-600 text-white px-4 rounded">Create</button>
    </form>
  </div>

  <button id="sortBtn" class="bg-purple-600 text-white px-4 py-2 rounded mb-4">
    Sort by Balance (High → Low)
  </button>

  <div id="dataCards"></div>

  <button id="add" class="bg-green-600 text-white px-4 py-2 rounded mt-4">Fetch Accounts</button>
  <button id="remove" class="bg-red-600 text-white px-4 py-2 rounded mt-4">Clear Data</button>

  <script src="./main.js"></script>
</body>
</html>
