<form (ngSubmit)="submit()">
  <input
    type="text"
    [value]="name()"
    (input)="name.set($event.target.value)"
  >

  <input
    type="email"
    [value]="email()"
    (input)="email.set($event.target.value)"
  >

  <button type="submit">Submit</button>
</form>

<p>Name: {{ name() }}</p>
<p>Email: {{ email() }}</p>
