<div class="min-h-screen flex items-center justify-center bg-linear-to-br from-slate-900 via-slate-800 to-slate-900 p-6">

  <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 shadow-2xl rounded-3xl p-8 space-y-6">

    <!-- Title -->
    <div class="text-center space-y-2">
      <h2 class="text-3xl font-semibold text-white">Create Account</h2>
      <p class="text-gray-400 text-sm">Register to continue</p>
    </div>

    <!-- Form -->
    <div class="space-y-4">

      <!-- Username -->
      <div>
        <label class="block text-sm text-gray-300 mb-1">Username</label>
        <input
          [(ngModel)]="username"
          placeholder="Enter Username"
          class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-300"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm text-gray-300 mb-1">Password</label>
        <input
          [(ngModel)]="password"
          type="password"
          placeholder="Enter Password"
          class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-300"
        />
      </div>

      <!-- Role -->
      <div>
        <label class="block text-sm text-gray-300 mb-1">Role</label>
        <input
          [(ngModel)]="role"
          placeholder="Enter Role"
          class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-300"
        />
      </div>

      <!-- Button -->
      <button
        (click)="register()"
        class="w-full bg-linear-to-r from-indigo-500 to-purple-600 text-white py-2.5 rounded-xl font-medium shadow-lg hover:scale-[1.02] hover:shadow-indigo-500/40 transition-all duration-300"
      >
        Register
      </button>

      <a href="/login" class="text-white pl-5">Already a user ? Login </a>

    </div>

  </div>
</div>
