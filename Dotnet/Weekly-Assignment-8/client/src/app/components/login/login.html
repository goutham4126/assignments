<div class="min-h-screen flex items-center justify-center bg-linear-to-br from-slate-900 via-slate-800 to-slate-900 p-6">

  <div class="w-full max-w-md bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl">

    <!-- Title -->
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-white">Welcome Back</h2>
      <p class="text-gray-400 text-sm mt-2">Login to your account</p>
    </div>

    <!-- Form -->
    <form class="space-y-6" (submit)="login(); $event.preventDefault()">

      <!-- Username -->
      <div>
        <label class="block text-sm text-gray-300 mb-2">
          Username
        </label>
        <input
          type="text"
          placeholder="Enter your username"
          class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-300"
          (input)="username.set($any($event.target).value)"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm text-gray-300 mb-2">
          Password
        </label>
        <input
          type="password"
          placeholder="Enter your password"
          class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-300"
          (input)="password.set($any($event.target).value)"
        />
      </div>

      <!-- CAPTCHA -->
      <div>
        <label class="block text-sm text-gray-300 mb-2">
          Enter CAPTCHA
        </label>

        <!-- Captcha Display -->
        <div class="flex items-center gap-4 mb-3">
          <div
            class="bg-white/10 px-4 py-2 rounded-lg text-lg font-bold tracking-widest text-indigo-400 select-none"
          >
            {{ generatedCaptcha() }}
          </div>

          <button
            type="button"
            (click)="generateCaptcha()"
            class="text-sm text-indigo-400 hover:text-indigo-300 transition"
          >
            Refresh
          </button>
        </div>

        <!-- Captcha Input -->
        <input
          type="text"
          placeholder="Enter captcha"
          class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          (input)="enteredCaptcha.set($any($event.target).value)"
        />

        <p *ngIf="captchaError()" class="text-red-400 text-sm mt-2">
          {{ captchaError() }}
        </p>
      </div>

      <!-- Button -->
      <button
        type="submit"
        class="w-full bg-linear-to-r from-indigo-500 to-purple-600 py-3 rounded-xl font-medium text-white hover:scale-[1.02] hover:shadow-indigo-500/40 transition-all duration-300"
      >
        Login
      </button>

      <a href="/register" class="text-white pl-5">New user ? Register </a>

    </form>

  </div>

</div>
