@if (user()) {
  <nav class="p-4 bg-linear-to-r from-slate-900 via-slate-800 to-slate-900 border-b border-white/10 flex items-center px-8">

    <div class="max-w-7xl mx-auto w-full flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="h-12 w-12 rounded-xl bg-linear-to-r from-indigo-500 to-purple-600 flex items-center justify-center text-lg font-bold shadow-lg">
          {{ user().username.charAt(0).toUpperCase() }}
        </div>

        <div>
          <p class="text-white font-semibold text-lg">
            Welcome, {{ user().username }}
          </p>
          <p class="text-sm text-gray-400">
            {{ user().role }}
          </p>
        </div>
      </div>

      <!-- Right Section -->
      <div class="flex items-center gap-4">

        <button
          (click)="Logout()"
          class="bg-red-500/20 text-red-400 border border-red-500/40 px-5 py-2 rounded-xl font-medium hover:bg-red-500 hover:text-white transition-all duration-300"
        >
          Logout
        </button>

      </div>

    </div>

  </nav>
}
